name: Build JOS Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "manifest.json"
      - "service-worker.js"
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.json"
      - ".github/workflows/build-android.yml"
      - "jos-icon-*.png"
      - "jos-splash-screen.webp"
      - "resources/**"
      - "android-branding/**"
      - "www/**"
      - "chat.html"

permissions:
  contents: write

concurrency:
  group: jos-android-production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Package customer website
        run: |
          set -euo pipefail
          mkdir -p www
          cp index.html www/index.html
          cp manifest.json service-worker.js jos-icon-192.png jos-icon-512.png jos-icon-pwa-192-v3.png jos-icon-pwa-512-v3.png jos-splash-screen.webp www/

      - name: Configure one full-screen 3D splash for APK only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('www/index.html')
          s=p.read_text()
          old='/jos-splash-screen.png?v=20261123'
          if s.count(old) != 1:
              raise SystemExit(f'Expected one legacy splash reference, found {s.count(old)}')
          s=s.replace(old,'/jos-splash-screen.webp?v=20261126',1)
          css='''<style id="jos-apk-single-splash-3d">
          #josLaunchSplash{display:none!important}
          </style>'''
          if 'jos-apk-single-splash-3d' in s:
              raise SystemExit('Splash override already exists')
          if '</head>' not in s:
              raise SystemExit('HTML head closing tag missing')
          s=s.replace('</head>',css+'\n</head>',1)
          p.write_text(s)
          print('APK web layer configured with exactly one full-screen 3D splash.')
          PY

      - name: Install Capacitor
        run: npm install

      - name: Generate Android project
        run: npx cap add android

      - name: Declare Android location permissions
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path("android/app/src/main/AndroidManifest.xml")
          s=p.read_text()
          permissions=[
              '    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />',
              '    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />'
          ]
          for item in permissions:
              if item not in s:
                  pos=s.find("<application")
                  if pos < 0: raise SystemExit("Android application tag not found")
                  s=s[:pos]+item+"\\n"+s[pos:]
          p.write_text(s)
          print("Android location permissions declared.")
          PY

      - name: Configure native deep link callback
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path("android/app/src/main/AndroidManifest.xml")
          s=p.read_text()
          marker='android:scheme="josapp"'
          if marker not in s:
              intent='''<intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="josapp" android:host="auth" android:path="/callback" />
                      </intent-filter>'''
              pos=s.find('</activity>')
              if pos < 0: raise SystemExit("MainActivity closing tag not found")
              s=s[:pos]+intent+s[pos:]
          activity=None
          for match in re.finditer(r'<activity[^>]*>',s):
              if 'MainActivity' in match.group(0):
                  activity=match
                  break
          if activity is None:
              raise SystemExit("MainActivity declaration not found")
          if 'android:launchMode=' not in activity.group(0):
              s=s[:activity.end()-1]+' android:launchMode="singleTask"'+s[activity.end()-1:]
          p.write_text(s)
          PY

      - name: Install native WebView Google OAuth bridge
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          files=list(Path("android/app/src/main/java").rglob("MainActivity.java"))
          if len(files)!=1:
              raise SystemExit(f"Expected one Capacitor MainActivity.java, found {len(files)}")
          p=files[0]
          s=p.read_text()
          imports=[
              "import android.webkit.JavascriptInterface;",
              "import android.content.Intent;",
              "import android.net.Uri;",
              "import org.json.JSONObject;"
          ]
          line_end=s.find("\n")
          if line_end < 0: raise SystemExit("Java package declaration missing")
          for item in imports:
              if item not in s:
                  s=s[:line_end+1]+item+"\n"+s[line_end+1:]
                  line_end=s.find("\n")
          if "new JosAndroidBridge()" not in s:
              pos=s.find("{",s.find("class MainActivity"))
              if pos < 0: raise SystemExit("MainActivity class declaration missing")
              code='''
              @Override
              public void onCreate(android.os.Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getBridge().getWebView().addJavascriptInterface(new JosAndroidBridge(), "JosAndroid");
              }

              private class JosAndroidBridge {
                  @JavascriptInterface
                  public void goHome() {
                      runOnUiThread(() -> {
                          if (getBridge() != null && getBridge().getWebView() != null) {
                              getBridge().getWebView().loadUrl("https://localhost/");
                          }
                      });
                  }

                  @JavascriptInterface
                  public void openChat() {
                      runOnUiThread(() -> {
                          if (getBridge() != null && getBridge().getWebView() != null) {
                              getBridge().getWebView().getSettings().setCacheMode(android.webkit.WebSettings.LOAD_NO_CACHE);\n                              getBridge().getWebView().loadUrl("https://jasaorangsuruhan.my.id/chat.html?app=1.1.0");
                          }
                      });
                  }

                  @JavascriptInterface
                  public void openGoogleAuth(String url) {
                      try {
                          Uri target=Uri.parse(url);
                          String host=target.getHost()==null?"":target.getHost().toLowerCase();
                          if (!"https".equals(target.getScheme()) || !host.endsWith(".supabase.co")) return;
                          runOnUiThread(() -> {
                              try { startActivity(new Intent(Intent.ACTION_VIEW,target)); }
                              catch (Exception ignored) {}
                          });
                      } catch (Exception ignored) {}
                  }
              }

              @Override
              protected void onNewIntent(Intent intent) {
                  super.onNewIntent(intent);
                  setIntent(intent);
                  Uri callback=intent==null?null:intent.getData();
                  if(callback!=null && "josapp".equals(callback.getScheme())
                      && "auth".equals(callback.getHost()) && "/callback".equals(callback.getPath())) {
                      final String callbackUrl=callback.toString();
                      getBridge().getWebView().post(() -> getBridge().getWebView().evaluateJavascript(
                          "if(window.josHandleNativeGoogleCallback){window.josHandleNativeGoogleCallback("
                          + JSONObject.quote(callbackUrl) + ");}", null));
                  }
              }
              '''
              s=s[:pos+1]+code+s[pos+1:]
          p.write_text(s)
          print("Installed JosAndroid JavaScript bridge in",p)
          PY

      - name: Decode the two approved JOS Android images
        run: |
          set -euo pipefail
          mkdir -p assets
          cat android-branding/icon-512/*.b64 | tr -d '\r\n[:space:]' | base64 --decode > /tmp/jos-app-icon.webp
          cp jos-splash-screen.webp /tmp/jos-splash.webp
          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          from PIL import Image
          from collections import deque
          from pathlib import Path

          icon_src=Image.open('/tmp/jos-app-icon.webp').convert('RGBA')
          splash_src=Image.open('/tmp/jos-splash.webp').convert('RGBA')
          icon_src.load(); splash_src.load()
          if icon_src.size != (512,512):
              raise SystemExit(f'Wrong launcher source dimensions: {icon_src.size}')
          if splash_src.size != (384,384):
              raise SystemExit(f'Wrong approved square 3D logo dimensions: {splash_src.size}')

          # Keep the entire first image and its square canvas. Remove only the
          # black matte connected to the outer corners so Android can mask the
          # rounded white tile cleanly; the logo artwork itself is untouched.
          px=icon_src.load()
          w,h=icon_src.size
          q=deque([(0,0),(w-1,0),(0,h-1),(w-1,h-1)])
          seen=set()
          while q:
              x,y=q.popleft()
              if (x,y) in seen or x<0 or y<0 or x>=w or y>=h: continue
              seen.add((x,y))
              r,g,b,a=px[x,y]
              if max(r,g,b) <= 48:
                  px[x,y]=(r,g,b,0)
                  q.extend(((x-1,y),(x+1,y),(x,y-1),(x,y+1)))

          # Native launcher sources: same square composition, no crop/stretch.
          icon_1024=icon_src.resize((1024,1024),Image.Resampling.LANCZOS)
          icon_1024.save('assets/icon.png',format='PNG',optimize=True)
          icon_1024.save('assets/icon-only.png',format='PNG',optimize=True)
          foreground=Image.new('RGBA',(1024,1024),(0,0,0,0))
          safe=icon_src.resize((760,760),Image.Resampling.LANCZOS)
          foreground.alpha_composite(safe,((1024-760)//2,(1024-760)//2))
          foreground.save('assets/icon-foreground.png',format='PNG',optimize=True)
          Image.new('RGBA',(1024,1024),(255,255,255,255)).save(
              'assets/icon-background.png',format='PNG',optimize=True)

          # Preserve the approved square 3D logo without cropping or stretching.
          splash_2732=splash_src.resize((2732,2732),Image.Resampling.LANCZOS)
          splash_2732.save('assets/splash.png',format='PNG',optimize=True)
          splash_2732.save('assets/splash-dark.png',format='PNG',optimize=True)
          print('Approved launcher image:',icon_src.size,'-> Android icon')
          print('Approved square 3D JOS logo for native splash:',splash_src.size)
          PY
          npx capacitor-assets generate --android

      - name: Sync native project
        run: npx cap sync android

      - name: Set JOS Android version for Chat Admin bridge fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path("android/app/build.gradle")
          s=p.read_text()
          s,n1=re.subn(r'versionCode\s+\d+', 'versionCode 15', s, count=1)
          s,n2=re.subn(r'versionName\s+[\'"][^\'"]+[\'"]', "versionName '1.1.5'", s, count=1)
          if n1 != 1 or n2 != 1:
              raise SystemExit(f"Expected one versionCode and versionName; found {n1}, {n2}")
          p.write_text(s)
          print("JOS APK version set to 1.1.5 (versionCode 15)")
          PY

      - name: Install the approved 3D JOS logo as the single native splash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          root=Path('android/app/src/main/res')
          source=Image.open('/tmp/jos-splash.webp').convert('RGBA')
          source.load()
          if source.size != (1254,1254):
              raise SystemExit(f'Unexpected 3D logo size: {source.size}')
          d=root/'drawable-nodpi'; d.mkdir(parents=True,exist_ok=True)
          source.resize((1024,1024),Image.Resampling.LANCZOS).save(d/'jos_splash_icon.png',optimize=True)
          bg=root/'drawable'; bg.mkdir(parents=True,exist_ok=True)
          (bg/'jos_splash_background.xml').write_text('''<layer-list xmlns:android="http://schemas.android.com/apk/res/android"><item android:drawable="#087FE8"/><item><bitmap android:gravity="center" android:src="@drawable/jos_splash_icon" android:filter="true"/></item></layer-list>''')
          print('Installed the exact new square 3D logo as native launch artwork, with no crop.')
          PY

      - name: Configure the single native 3D splash and remove the web duplicate
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest=Path('android/app/src/main/AndroidManifest.xml').read_text()
          activity=re.search(r'<activity\b[^>]*>',manifest,re.S)
          app=re.search(r'<application\b[^>]*>',manifest,re.S)
          tag=activity.group(0) if activity and 'android:theme=' in activity.group(0) else (app.group(0) if app else '')
          theme_match=re.search(r'android:theme="@style/([^"]+)"',tag)
          if not theme_match:
              raise SystemExit('Could not find the actual Android launch theme in the manifest')
          theme=theme_match.group(1)

          base=Path('android/app/src/main/res/values/styles.xml')
          if not base.exists():
              raise SystemExit('Base Android styles.xml not found')
          base_text=base.read_text()
          base_text=re.sub(r'(<item\b[^>]*\bname=["\']android:windowBackground["\'][^>]*>).*?(</item>)',r'\1@drawable/jos_splash_background\2',base_text,flags=re.S)
          base.write_text(base_text)
          style_pattern=re.compile(r'<style\b(?=[^>]*\bname=["\']'+re.escape(theme)+r'["\'])[^>]*>.*?</style>',re.S)
          base_style=style_pattern.search(base_text)
          if not base_style:
              raise SystemExit(f'Launch theme {theme} not found in base styles.xml')

          target_dir=Path('android/app/src/main/res/values-v31')
          target_dir.mkdir(parents=True,exist_ok=True)
          target=target_dir/'styles.xml'
          target_text=target.read_text() if target.exists() else '<resources>\n</resources>\n'
          existing=style_pattern.search(target_text)
          style=existing.group(0) if existing else base_style.group(0)

          def put_item(xml,name,value):
              pattern=re.compile(r'(<item\b[^>]*\bname=["\']'+re.escape(name)+r'["\'][^>]*>).*?(</item>)',re.S)
              replacement=r'\1'+value+r'\2'
              if pattern.search(xml):
                  return pattern.sub(replacement,xml,count=1)
              return xml.replace('</style>',f'        <item name="{name}">{value}</item>\n    </style>',1)

          style=put_item(style,'android:windowSplashScreenAnimatedIcon','@drawable/jos_splash_icon')
          style=put_item(style,'android:windowSplashScreenBackground','#087FE8')
          if existing:
              target_text=target_text[:existing.start()]+style+target_text[existing.end():]
          else:
              target_text=target_text.replace('</resources>',style+'\n</resources>')
          target.write_text(target_text)
          if '@drawable/jos_splash_icon' not in target.read_text():
              raise SystemExit('Failed to apply the new 3D JOS logo to the Android system splash')
          print(f'Android launch theme {theme}: new 3D JOS logo replaces the blank system splash.')
          PY

      - name: Preserve the exact square splash artwork on every Android screen size
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          source=Image.open('/tmp/jos-splash.webp').convert('RGBA')
          source.load()
          root=Path('android/app/src/main/res')
          targets=sorted(root.glob('drawable*/splash.png'))
          if not targets:
              raise SystemExit('Capacitor did not generate Android splash resources')
          for target in targets:
              with Image.open(target) as current:
                  width,height=current.size
              from PIL import ImageOps
              full=ImageOps.fit(source,(width,height),method=Image.Resampling.LANCZOS,centering=(0.5,0.5))
              full.save(target,format='PNG',optimize=True)
          print(f'Applied one full-screen 3D artwork to {len(targets)} Android splash resources.')
          PY

      - name: Force approved JOS launcher icons into Android resources
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import re
          source=Image.open('assets/icon-only.png').convert('RGBA')
          foreground_source=Image.open('assets/icon-foreground.png').convert('RGBA')
          root=Path('android/app/src/main/res')
          sizes={'mipmap-mdpi':48,'mipmap-hdpi':72,'mipmap-xhdpi':96,'mipmap-xxhdpi':144,'mipmap-xxxhdpi':192}
          for folder,size in sizes.items():
              d=root/folder; d.mkdir(parents=True,exist_ok=True)
              icon=source.resize((size,size),Image.Resampling.LANCZOS)
              icon.save(d/'ic_launcher.png',optimize=True)
              icon.save(d/'ic_launcher_round.png',optimize=True)
              fg=foreground_source.resize((size,size),Image.Resampling.LANCZOS)
              fg.save(d/'ic_launcher_foreground.png',optimize=True)
          values=root/'values'; values.mkdir(parents=True,exist_ok=True)
          (values/'jos_launcher_colors.xml').write_text(
              '<resources><color name="jos_launcher_background">#FFFFFF</color></resources>')
          manifest=Path('android/app/src/main/AndroidManifest.xml')
          text=manifest.read_text()
          start=text.find('<application')
          end=text.find('>',start)
          if start < 0 or end < 0: raise SystemExit("Android application tag not found")
          tag=text[start:end+1]
          tag=re.sub(r'android:icon="[^"]+"','',tag)
          tag=re.sub(r'android:roundIcon="[^"]+"','',tag)
          tag=tag[:-1]+' android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher_round">'
          manifest.write_text(text[:start]+tag+text[end+1:])
          adaptive=root/'mipmap-anydpi-v26'; adaptive.mkdir(parents=True,exist_ok=True)
          xml='''<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@color/jos_launcher_background"/><foreground android:drawable="@mipmap/ic_launcher_foreground"/></adaptive-icon>'''
          (adaptive/'ic_launcher.xml').write_text(xml)
          (adaptive/'ic_launcher_round.xml').write_text(xml)
          print("Android manifest points to the approved JOS launcher assets.")
          PY

      - name: Verify generated Android branding assets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageChops
          root=Path('android/app/src/main/res')
          candidates=list(root.glob('mipmap*/ic_launcher*.png'))+list(root.glob('drawable*/splash*.png'))
          if not candidates:
              raise SystemExit("No generated launcher/splash assets found")
          for p in candidates:
              im=Image.open(p).convert('RGBA')
              im.load()
              if im.width < 24 or im.height < 24:
                  raise SystemExit(f"Generated asset invalid: {p} {im.size}")
          if not (root/'mipmap-mdpi/ic_launcher.png').exists():
              raise SystemExit("Launcher icon missing")
          print(f"Verified {len(candidates)} Android launcher/splash PNG assets")
          PY

      - name: Verify packaged web app
        run: |
          test -s www/index.html
          grep -q "Jasa Orang Suruhan" www/index.html
          test "$(wc -c < www/index.html)" -gt 500000

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Inspect and verify the APK package, signature, icon, and splash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          ls -lh "$APK"
          unzip -tq "$APK"
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$SDK"
          APKSIGNER="$(find "$SDK/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          AAPT="$(find "$SDK/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          test -x "$AAPT"
          "$APKSIGNER" verify --verbose "$APK"
          "$AAPT" dump badging "$APK" | tee /tmp/jos-apk-badging.txt
          grep -Fq "package: name='id.jos.pelanggan'" /tmp/jos-apk-badging.txt
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageChops
          from io import BytesIO
          import zipfile

          apk=Path('android/app/build/outputs/apk/debug/app-debug.apk')
          with zipfile.ZipFile(apk) as z:
              bad=z.testzip()
              if bad: raise SystemExit(f'Corrupt APK ZIP entry: {bad}')
              names=z.namelist()
              required=[
                'AndroidManifest.xml',
                'classes.dex',
                'res/mipmap-xxxhdpi-v4/ic_launcher.png',
                'res/mipmap-xxxhdpi-v4/ic_launcher_foreground.png',
                'res/mipmap-anydpi-v26/ic_launcher.xml',
                'res/drawable-port-xxxhdpi-v4/splash.png'
              ]
              for name in required:
                  if name not in names: raise SystemExit(f'Missing APK resource: {name}')
              actual_icon=Image.open(BytesIO(z.read('res/mipmap-xxxhdpi-v4/ic_launcher.png'))).convert('RGBA')
              expected_icon=Image.open('assets/icon-only.png').convert('RGBA').resize((192,192),Image.Resampling.LANCZOS)
              if ImageChops.difference(actual_icon,expected_icon).getbbox():
                  raise SystemExit('APK launcher icon does not match the supplied first image')
              actual_splash=Image.open(BytesIO(z.read('res/drawable-port-xxxhdpi-v4/splash.png'))).convert('RGBA')
              source=Image.open('/tmp/jos-splash.webp').convert('RGBA')
              from PIL import ImageOps
              w,h=actual_splash.size
              expected=ImageOps.fit(source,(w,h),method=Image.Resampling.LANCZOS,centering=(0.5,0.5))
              if ImageChops.difference(actual_splash,expected).getbbox():
                  raise SystemExit('APK splash does not match the approved single full-screen 3D artwork')
              print('APK package integrity: OK')
              print('Launcher icon: exact match to supplied first image (Android sizes rasterized only)')
              print('Splash screen: single native 3D JOS logo; HTML duplicate disabled')
          PY

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jos-pelanggan-production-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish direct APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: production-latest
          name: JOS Pelanggan Android (Production)
          prerelease: true
          make_latest: false
          files: android/app/build/outputs/apk/debug/app-debug.apk
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
