<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#073b35">
  <title>JOS — Sedang Perbaikan</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 24px; background: #f3f8f6; color: #173b35;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    }
    main {
      width: min(100%, 430px); padding: 30px 24px; text-align: center;
      background: #fff; border: 1px solid #e2eeea; border-radius: 22px;
      box-shadow: 0 14px 40px rgba(7, 59, 53, .09);
    }
    .logo {
      width: 76px; height: 76px; margin: 0 auto 16px; display: grid;
      place-items: center; border-radius: 22px; background: #073b35;
      color: #fff; font-size: 27px; font-weight: 850; letter-spacing: -1px;
      box-shadow: 0 8px 18px rgba(7, 59, 53, .2);
    }
    .status {
      display: inline-flex; align-items: center; gap: 7px; margin-bottom: 14px;
      padding: 7px 12px; border-radius: 999px; background: #e8f5ef;
      color: #14734e; font-size: 12px; font-weight: 700;
    }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: #1aa36b; }
    h1 { margin: 0 0 10px; font-size: clamp(23px, 6vw, 29px); line-height: 1.2; }
    p { margin: 0; color: #62756f; font-size: 14px; line-height: 1.65; }
    button {
      width: 100%; margin-top: 22px; padding: 13px 18px; border: 0;
      border-radius: 12px; background: #073b35; color: white;
      font-size: 14px; font-weight: 750; cursor: pointer;
    }
    button:active { transform: scale(.99); }
    .brand { margin-top: 20px; color: #14734e; font-size: 12px; font-weight: 750; }
    .small { margin-top: 12px; font-size: 11px; color: #91a19c; }
  </style>
</head>
<body>
  <main>
    <div class="logo" aria-label="JOS">JOS</div>
    <div class="status"><span class="dot"></span> PEMELIHARAAN SEMENTARA</div>
    <h1>Kami Sedang Melakukan Perbaikan</h1>
    <p>
      Mohon maaf, layanan JOS sedang dalam pemeliharaan sementara
      karena ada pembaruan sistem. Silakan coba kembali beberapa saat lagi.
    </p>
    <button type="button" onclick="cobaLagi()">Coba Lagi</button>
    <div class="brand">Bersama JOS, semua pasti beres!</div>
    <div class="small" id="info">Halaman akan memeriksa ketersediaan layanan secara berkala.</div>
  </main>
  <script>
    const appUrl = new URL("./index.html?launch=jos-pelanggan-v1", location.href);
    let checking = false;

    async function periksaLayanan() {
      if (checking) return;
      checking = true;
      const info = document.getElementById("info");
      try {
        const response = await fetch("./index.html?maintenance-check=" + Date.now(), {
          method: "GET",
          cache: "no-store",
          headers: { "X-JOS-Maintenance-Check": "1" }
        });
        if (response.ok) {
          info.textContent = "Layanan sudah tersedia. Membuka aplikasi...";
          location.replace(appUrl.href);
          return;
        }
        info.textContent = "Layanan masih diperbarui. Silakan coba lagi sebentar.";
      } catch (_) {
        info.textContent = "Koneksi belum tersedia. Periksa kembali beberapa saat lagi.";
      } finally {
        checking = false;
      }
    }

    function cobaLagi() { periksaLayanan(); }
    setInterval(periksaLayanan, 20000);
  </script>
</body>
</html>
