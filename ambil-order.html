<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ambil Order - JOS</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 20px;
      background: #f1f5f9;
      font-family: Arial, sans-serif;
      color: #1e293b;
    }

    .card {
      max-width: 430px;
      margin: 30px auto;
      padding: 24px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 5px 20px #00000012;
    }

    h1 {
      margin-top: 0;
      text-align: center;
      color: #087443;
    }

    p {
      text-align: center;
      color: #64748b;
    }

    label {
      display: block;
      margin-top: 16px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      margin-top: 7px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 22px;
      border: 0;
      border-radius: 8px;
      background: #087443;
      color: white;
      font-size: 16px;
      font-weight: bold;
    }

    button:disabled {
      opacity: .6;
    }

    #hasil {
      margin-top: 18px;
      padding: 12px;
      border-radius: 8px;
      overflow-wrap: anywhere;
    }

    .catatan {
      font-size: 12px;
      line-height: 1.5;
      margin-top: 20px;
    }
  </style>
</head>

<body>
  <main class="card">
    <h1>JOS - Ambil Order</h1>
    <p>Jasa Orang Suruhan</p>

    <form id="formOrder">
      <label for="kode">Kode Order</label>
      <input
        id="kode"
        type="text"
        required
        autocomplete="off"
        placeholder="Contoh: JOS-12345678"
      >

      <label for="nama">Nama Mitra</label>
      <input
        id="nama"
        type="text"
        required
        maxlength="100"
        autocomplete="name"
        placeholder="Masukkan nama"
      >

      <label for="wa">Nomor WhatsApp Mitra</label>
      <input
        id="wa"
        type="tel"
        required
        maxlength="20"
        autocomplete="tel"
        placeholder="Contoh: 081234567890"
      >

      <button id="tombol" type="submit">
        AMBIL ORDER
      </button>
    </form>

    <div id="hasil" role="status" hidden></div>

    <p class="catatan">
      Pengambilan order bergantung pada ketersediaan pesanan.
      Nama dan nomor WhatsApp yang dimasukkan belum diverifikasi.
    </p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL =
      "https://aqhfkcdglfijdtsgyzmq.supabase.co";

    // Ganti teks ini dengan Publishable Key milik proyek kamu.
    // Jangan pernah memasukkan Secret Key atau service_role key.
    const SUPABASE_PUBLISHABLE_KEY =
      "TEMPEL_PUBLISHABLE_KEY_DI_SINI";

    const hasil = document.getElementById("hasil");
    const tombol = document.getElementById("tombol");

    document.getElementById("formOrder").addEventListener(
      "submit",
      async function(event) {
        event.preventDefault();

        const kode = document.getElementById("kode").value.trim();
        const nama = document.getElementById("nama").value.trim();
        const wa = document.getElementById("wa").value.trim();

        if (
          SUPABASE_PUBLISHABLE_KEY ===
          "TEMPEL_PUBLISHABLE_KEY_DI_SINI"
        ) {
          tampilkan(
            "Koneksi belum disiapkan. Publishable Key perlu dimasukkan dahulu.",
            false
          );
          return;
        }

        tombol.disabled = true;
        tombol.textContent = "MEMPROSES...";

        try {
          const client = window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY
          );

          const { data, error } = await client.rpc(
            "ambil_order",
            {
              p_kode_order: kode,
              p_nama_mitra: nama,
              p_whatsapp_mitra: wa
            }
          );

          if (error) throw error;

          const respons = Array.isArray(data) ? data[0] : data;

          if (respons && respons.berhasil) {
            tampilkan(
              "Pengambilan berhasil diajukan untuk kode " +
              respons.kode_order + ".",
              true
            );
          } else {
            tampilkan(
              respons && respons.pesan
                ? respons.pesan
                : "Order belum dapat diambil.",
              false
            );
          }
        } catch (error) {
          console.error(error);
          tampilkan(
            "Permintaan gagal. Periksa konfigurasi dan izin database.",
            false
          );
        } finally {
          tombol.disabled = false;
          tombol.textContent = "AMBIL ORDER";
        }
      }
    );

    function tampilkan(pesan, berhasil) {
      hasil.hidden = false;
      hasil.textContent = pesan;
      hasil.style.background = berhasil ? "#dcfce7" : "#fee2e2";
      hasil.style.color = berhasil ? "#166534" : "#991b1b";
    }
  </script>
</body>
</html>
